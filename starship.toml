add_newline = true
palette = 'catppuccin_mocha'

format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$package\
$aws\
$docker_context\
$jobs\
$line_break\
$character\
"""


continuation_prompt = '▶▶ '

[character]
success_symbol = "🚀 "
error_symbol = "🔥 "

[time]
disabled = false
time_format = "%r" # Hour:Minute Format
style = "bg:#fff"
format = '[[ 󱑍 $time ](bg:#fff fg:#fff)]($style)'


[directory]
style = 'bold fg:peach'
format = '[$path ]($style)'
truncation_length = 1
truncation_symbol = ''
truncate_to_repo = true

[git_branch]
symbol = " "
format = '[$symbol$branch]($style)'
# truncation_length = 1
truncation_symbol = ''
style = 'bold sky'

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'bold green'
conflicted = ' 🚩 '
up_to_date = ''
untracked = ' '
ahead = ' ⇡${count} '
diverged = ' ⇕⇡${ahead_count}⇣${behind_count} '
behind = ' ⇣${count} '
stashed = ' '
modified = ' ️'
staged = ' [++\($count\)](green) '
renamed = ' ✍️ '
deleted = ' 🚫 '

[fill]
symbol = ' '

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = ' '

[memory_usage]
symbol = "󰍛 "
disabled = true
style='bold dimmed white'
threshold = 1
format = "$symbol [${ram}(|${swap})]($style) "

[nodejs]
style = 'purple'
symbol = ' '

[golang]
style = 'blue'
symbol = ' '

[haskell]
style = 'blue'
symbol = ' '

[rust]
style = 'orange'
symbol = ' '

[ruby]
style = 'blue'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

